<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>L2Axis Control</title>
<style>
  /* impeccable-disable single-font, flat-type-hierarchy, em-dash-overuse -- body is Tahoma via the font shorthand; one family at game sizes (9/10/11/17px) is the design (DESIGN.md, Typography); the em dashes are empty-value placeholders, not prose */
  :root {
    --op: .92;
    --text: #d9cfb4;
    --text-hi: #f3e9cc;
    --dim: #9c937c;            /* secondary text: >= 5:1 on every panel surface */
    --gold: #c9a55a;
    --gold-hi: #f0cf7e;
    --frame: #6a5c3e;
    --frame-dark: #2a241a;
    --good: #7fd36b;
    --warn: #e8c547;
    --bad: #e45a4a;
    --cp: #d58f1d;
    --hp: #b3261e;
    --mp: #2552b8;
    --well: #050505;           /* inside of inputs, canvas, checkboxes */
    --line: #4a4232;           /* 1px ring of controls and map frame */
    --ink-btn: #e8dcc0;        /* button text */
    --good-soft: #c9e3a5;      /* craftable / bonus text */
    --bad-hi: #f08a7a;         /* error text on dark */
    --bronze: #a77f35;         /* lower stop of gold gradients */
    --bronze-deep: #8c6a2c;
    --fav-off: #776c56;        /* inactive favourite star: 3.6:1 */
    --focus: #f0cf7e;          /* keyboard focus ring */
    /* surfaces */
    --base: #0b0a08;
    --icon-bg: #15120d;
    --bar-track: #1a1712;
    --line-dim: #3a3328;
    /* bevels */
    --bevel-hi: #6d5b3a;
    --bevel-mid: #4a3d27;
    --bevel-lo: #2c2416;
    --bevel-ring: #8c784e;
    --bevel-hover-hi: #85704a;
    --bevel-hover-mid: #5a4b30;
    --bevel-hover-lo: #372d1c;
    --bevel-off-hi: #2a261f;
    --bevel-off-lo: #191612;
    --ink-off: #5d5648;
    --titlebar-hi: #3b3326;
    --titlebar-mid: #1d1912;
    --titlebar-lo: #120f0a;
    --knob-hi: #5a4c33;
    --knob-lo: #2b2418;
    --knob-ring: #7d6a45;
    --knob-hover-hi: #77653f;
    --knob-hover-lo: #3a301f;
    --close-hover-hi: #8a2e22;
    --close-hover-lo: #3d140f;
    --tab-hi: #24201a;
    --tab-lo: #110f0c;
    --tab-sel-hi: #4a3f2b;
    --tab-sel-lo: #1e1a12;
    --ring-dark: #1c160c;
    --medal-hi: #4a3c22;
    --medal-lo: #120e08;
    --medal-tag: #f6dc94;
    --mon-hi: #1c1914;
    --mon-lo: #0d0c0a;
    --mon-drop-hi: #2a2418;
    --mon-drop-lo: #14110c;
    /* gauges */
    --cp-hi: #f0b54a;
    --cp-lo: #7a4c08;
    --hp-hi: #e2574b;
    --hp-lo: #5e0f0a;
    --mp-hi: #5a86e6;
    --mp-lo: #0f2768;
    --ok-hi: #9de07f;
    --ok-mid: #3f9a35;
    --ok-lo: #1e4d18;
    /* state text */
    --dead: #c96a5e;
    --epic-text: #f0b0a0;
    --note: #b8955a;
    --text-soft: #cbbf9f;
    --lore: #b9ad8e;
    /* grades and sources */
    --grade-s84: #e7b3ff;
    --grade-s84-lo: #8c4cc0;
    --grade-s80: #ffd0a0;
    --grade-s80-lo: #b9773a;
    --grade-plain: #d9d0b8;
    --badge-ink: #1a1408;
    --source-mw: #e7c8ff;
    --source-mw-bg: #4a2d5c;
    --source-npc: #b8dcff;
    --source-npc-bg: #24384a;
    --source-craft-bg: #2f4d26;
    --source-drop: #a39a86;
    --source-drop-bg: #2a2620;
    --source-unseal-bg: #5a4a24;
    --source-acc: #9fd1c6;
    --acc-text: #cfe8e1;
    --announce: #7fd4e6;
    /* map */
    --map-water: #3d4a4f;
    --map-label: #f1e3b8;
    --map-label-dim: #c9b27a;
    --map-town: #f3e6c2;
    --tp-label: #9fe3f0;
    --tp-label-custom: #bfeaf5;
    --spot: #b58cf0;
    --spot-other: #7c63a3;
    --spot-ink: #2b1d40;
    --acc-pin: #9fe38a;
    --acc-pin-text: #c9f0b5;
    --pin-dead: #c9c0b0;
    --pin-dead-ink: #3a342b;
    --pin-epic-dead: #d8b98a;
    --pin-ink: #1b1a17;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  /* dark background: only visible in the leftovers of the window shape, around the medallion */
  html, body { background: var(--base); height: 100%; overflow: hidden; }
  body {
    font: 11px Tahoma, Verdana, "Segoe UI", sans-serif;
    color: var(--text);
    user-select: none;
    -webkit-font-smoothing: none;
  }

  /* ------------------------------------------------ window frame */
  .wnd {
    position: absolute; inset: 12px 0 0 12px;
    display: flex; flex-direction: column;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(140, 106, 44, .18), transparent 60%),
      rgba(8, 8, 10, var(--op));
    border: 1px solid #000;
    box-shadow:
      inset 0 0 0 1px var(--frame),
      inset 0 0 0 2px #000,
      inset 0 0 0 3px rgba(106, 92, 62, .35),
      0 0 10px rgba(0,0,0,.8);
    border-radius: 3px;
  }
  /* ornamental corners */
  .wnd::before, .wnd::after {
    content: ""; position: absolute; width: 14px; height: 14px; pointer-events: none;
    border: 2px solid var(--gold);
  }
  .wnd::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-radius: 3px 0 0 0; }
  .wnd::after  { bottom: -1px; right: -1px; border-left: 0; border-top: 0; border-radius: 0 0 3px 0; }

  .title {
    height: 22px; flex: none;
    display: flex; align-items: center;
    padding: 0 4px 0 8px;
    background: linear-gradient(var(--titlebar-hi), var(--titlebar-mid) 55%, var(--titlebar-lo));
    border-bottom: 1px solid #000;
    box-shadow: 0 1px 0 rgba(201, 165, 90, .35);
  }
  .wnd > .title { padding-left: 34px; }
  .title .name { flex: 1; font-weight: bold; color: var(--text-hi); letter-spacing: .3px;
                 text-shadow: 1px 1px 0 #000; }
  .title .name b { color: var(--gold-hi); }
  .tbtn {
    width: 15px; height: 15px; margin-left: 3px;
    display: grid; place-items: center;
    font: bold 9px Tahoma; color: var(--text);
    background: linear-gradient(var(--knob-hi), var(--knob-lo));
    border: 1px solid #000; box-shadow: inset 0 0 0 1px var(--knob-ring);
    cursor: pointer;
  }
  .tbtn:hover { color: #fff; background: linear-gradient(var(--knob-hover-hi), var(--knob-hover-lo)); }
  .tbtn.on { color: var(--gold-hi); box-shadow: inset 0 0 0 1px var(--gold); }
  .tbtn.x:hover { background: linear-gradient(var(--close-hover-hi), var(--close-hover-lo)); }
  .tbtn svg { width: 9px; height: 9px; display: block; }
  .tbtn.txt { width: auto; padding: 0 5px; letter-spacing: .3px; }
  .compact #bCompact svg { transform: rotate(180deg); }  /* collapsed: the arrow says "expand" */

  /* ------------------------------------------------ summary (status window style) */
  .status { flex: none; padding: 6px 8px 5px; border-bottom: 1px solid rgba(106,92,62,.5); }
  .grow-g { display: flex; align-items: center; margin-top: 3px; }
  .grow-g .k { width: 56px; font-size: 10px; font-weight: bold; color: var(--gold); text-shadow: 1px 1px 0 #000; }
  .gauge { position: relative; height: 13px; flex: 1;
           background: var(--well); border: 1px solid #000; box-shadow: inset 0 0 0 1px var(--line-dim); }
  .gauge .fill { position: absolute; inset: 1px auto 1px 1px; }
  .status .gauge .fill { inset: 1px; transform-origin: left center; transform: scaleX(0);
                         transition: transform .4s cubic-bezier(.25, 1, .5, 1); }
  .gauge .val { position: absolute; inset: 0; text-align: center; line-height: 11px; font-size: 10px;
                color: #fff; text-shadow: 1px 1px 0 #000; }
  .fill.cp { background: linear-gradient(var(--cp-hi), var(--cp) 50%, var(--cp-lo)); }
  .fill.hp { background: linear-gradient(var(--hp-hi), var(--hp) 50%, var(--hp-lo)); }
  .fill.mp { background: linear-gradient(var(--mp-hi), var(--mp) 50%, var(--mp-lo)); }
  .fill.ok { background: linear-gradient(var(--ok-hi), var(--ok-mid) 50%, var(--ok-lo)); }
  .chips { display: flex; gap: 10px; margin-top: 5px; font-size: 10px; color: var(--dim); }
  .chips span b { color: var(--text-hi); font-weight: normal; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 3px;
         border: 1px solid #000; vertical-align: -1px; background: var(--line); }
  .dot.g { background: var(--good); box-shadow: 0 0 4px var(--good); }
  .dot.y { background: var(--warn); }
  .dot.r { background: var(--bad); }
  .toast { margin-top: 4px; color: var(--gold-hi); font-size: 10px; display: none; }

  /* ------------------------------------------------ tabs */
  .tabs { flex: none; display: flex; gap: 1px; padding: 5px 6px 0; border-bottom: 1px solid var(--frame); }
  .tab {
    flex: 1; font-size: 10px; text-align: center; height: 20px; line-height: 18px; cursor: pointer;
    color: var(--dim);
    background: linear-gradient(var(--tab-hi), var(--tab-lo));
    border: 1px solid #000; border-bottom: 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    border-radius: 3px 3px 0 0;
  }
  .tab:hover { color: var(--text); }
  .tab.sel { color: var(--gold-hi); background: linear-gradient(var(--tab-sel-hi), var(--tab-sel-lo));
             box-shadow: inset 0 0 0 1px rgba(201,165,90,.45); }
  .body { flex: 1; overflow-y: auto; padding: 6px; zoom: var(--scale, 1); }
  .tabs { zoom: var(--scale, 1); }
  /* resize grips: right edge, bottom edge and the corner */
  .grip { position: absolute; z-index: 20; }
  .grip.r { top: 30px; right: 0; bottom: 14px; width: 5px; cursor: ew-resize; }
  .grip.b { left: 14px; right: 14px; bottom: 0; height: 5px; cursor: ns-resize; }
  .grip.rb { right: 0; bottom: 0; width: 14px; height: 14px; cursor: nwse-resize;
             background: linear-gradient(135deg, transparent 0 55%, var(--gold) 55% 62%, transparent 62% 72%,
                                         var(--gold) 72% 79%, transparent 79%); opacity: .7; }
  .grip.rb:hover { opacity: 1; }
  .compact .grip.b { display: none; }
  .compact .grip.rb { cursor: ew-resize; }
  button.b[data-scale].on { color: var(--gold-hi); box-shadow: inset 0 0 0 1px var(--gold); }
  .page { display: none; }
  .page.sel { display: block; }
  .compact .tabs, .compact .body { display: none; }

  .body::-webkit-scrollbar { width: 10px; }
  .body::-webkit-scrollbar-track { background: var(--base); border-left: 1px solid var(--frame-dark); }
  .body::-webkit-scrollbar-thumb { background: linear-gradient(90deg, var(--knob-hi), var(--knob-lo)); border: 1px solid #000; }

  /* ------------------------------------------------ components */
  .osec { margin: 7px 2px 3px; display: flex; align-items: center; gap: 6px; font-size: 9px; letter-spacing: 1px;
          text-transform: uppercase; color: var(--gold); }
  .osec::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(201,165,90,.55), transparent); }
  .osec:first-child { margin-top: 1px; }
  .ogrid { display: grid; gap: 3px; }
  .ogrid.two { grid-template-columns: 1fr 1fr; }
  .ogrid.three { grid-template-columns: 1fr 1fr 1fr; }
  .ogrid.four { grid-template-columns: repeat(4, 1fr); }
  .ogrid button.b { width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .orow { display: flex; align-items: center; gap: 6px; min-height: 22px; }
  .orow .lbl { flex: 1; min-width: 0; }
  .orow input[type=range] { flex: 1; }
  .orow .pct { width: 34px; text-align: right; color: var(--gold-hi); font-family: Consolas, monospace; }
  .panel {
    position: relative; margin-bottom: 5px; padding: 5px 6px;
    background: linear-gradient(rgba(40,35,26,.55), rgba(16,14,11,.55));
    border: 1px solid #000; box-shadow: inset 0 0 0 1px rgba(106,92,62,.45);
  }
  .sep { height: 1px; margin: 6px 0;
         background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .5; }
  .row { display: flex; align-items: center; gap: 3px; }
  .grow { flex: 1; min-width: 0; }
  .small { font-size: 10px; color: var(--dim); }
  .hi { color: var(--text-hi); }

  button.b {
    height: 19px; padding: 0 7px; cursor: pointer;
    font: 11px Tahoma, sans-serif; color: var(--ink-btn);
    background: linear-gradient(var(--bevel-hi), var(--bevel-mid) 45%, var(--bevel-lo));
    border: 1px solid #000; box-shadow: inset 0 0 0 1px var(--bevel-ring), inset 0 2px 0 rgba(255,255,255,.08);
    text-shadow: 1px 1px 0 #000;
  }
  button.b:hover:not(:disabled) { color: #fff; background: linear-gradient(var(--bevel-hover-hi), var(--bevel-hover-mid) 45%, var(--bevel-hover-lo)); }
  button.b:active:not(:disabled) { background: linear-gradient(var(--bevel-lo), var(--bevel-mid)); }
  button.b:disabled { color: var(--ink-off); background: linear-gradient(var(--bevel-off-hi), var(--bevel-off-lo));
                      box-shadow: inset 0 0 0 1px var(--line-dim); cursor: default; }
  button.b.gold:disabled { color: var(--ink-off); box-shadow: inset 0 0 0 1px var(--line-dim); }
  button.b.gold { color: var(--gold-hi); box-shadow: inset 0 0 0 1px var(--gold), inset 0 2px 0 rgba(255,255,255,.1); }
  button.b.sq { width: 19px; padding: 0; }
  button.b.wide { width: 100%; margin-bottom: 3px; }
  .btnbar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; margin: 4px 0; }
  .btnbar.two { grid-template-columns: 1fr 1fr; }

  input.e {
    height: 18px; padding: 0 4px; font: 11px Tahoma; color: var(--text-hi);
    background: var(--well); border: 1px solid #000; box-shadow: inset 0 0 0 1px var(--line);
    outline: none;
  }
  input.e:focus { box-shadow: inset 0 0 0 1px var(--gold); }
  input.e::placeholder { color: var(--dim); }
  /* keyboard focus: a thin gold ring; mouse clicks show nothing */
  :focus { outline: none; }
  :focus-visible { outline: 1px solid var(--focus); outline-offset: 1px; }
  input.e:focus-visible, select.e:focus-visible { outline: none; box-shadow: inset 0 0 0 1px var(--focus); }
  .tab:focus-visible, .spi:focus-visible, .recipe:focus-visible, .boss:focus-visible, .sb:focus-visible,
  .ev:focus-visible, .spgrp:focus-visible, .prow:focus-visible { outline-offset: -1px; }
  input.name { width: 90px; background: transparent; box-shadow: none; font-weight: bold; padding: 0 2px; }
  input.name:hover { box-shadow: inset 0 0 0 1px var(--line); }
  input.name:focus { background: var(--well); box-shadow: inset 0 0 0 1px var(--gold); }

  label.chk { position: relative; display: flex; align-items: center; gap: 5px; cursor: pointer; color: var(--dim); margin: 3px 0; }
  /* the real checkbox stays in the page (keyboard, screen readers); the square is drawn next to it */
  label.chk input { position: absolute; left: 0; top: 0; width: 12px; height: 12px; margin: 0; opacity: 0; pointer-events: none; }
  label.chk input:focus-visible + i { outline: 1px solid var(--focus); outline-offset: 1px; }
  label.chk i { flex: none; width: 12px; height: 12px; background: var(--well); border: 1px solid #000;
                box-shadow: inset 0 0 0 1px var(--frame); position: relative; }
  label.chk input:checked + i::after { content: "✔"; position: absolute; left: 1px; top: -2px;
                                       color: var(--gold-hi); font-size: 11px; }

  input[type=range] { -webkit-appearance: none; width: 100%; height: 8px; background: var(--well);
                      border: 1px solid #000; box-shadow: inset 0 0 0 1px var(--line); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 10px; height: 14px;
      background: linear-gradient(var(--bevel-ring), var(--knob-hover-lo)); border: 1px solid #000; cursor: pointer; }

  /* clients */
  .sechead { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; margin: 1px 0 4px; }
  .sechead.accs { margin-top: 9px; }
  .sechead .ttl { font-size: 9px; letter-spacing: 1px; text-transform: uppercase; color: var(--gold); white-space: nowrap; }
  .sechead .cnt { font-size: 10px; color: var(--dim); white-space: nowrap; margin-left: 4px; }
  .sechead .rule { flex: 1 1 12px; height: 1px; margin: 0 4px; background: linear-gradient(90deg, rgba(201,165,90,.55), transparent); }
  .sechead button.b { height: 18px; padding: 0 7px; font-size: 10px; }
  button.b.ico { width: 22px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  button.b.ico svg { width: 13px; height: 13px; }
  button.b.mv { padding: 0 5px; font-size: 10px; }
  button.b.mv.on { color: var(--gold-hi); box-shadow: inset 0 0 0 1px var(--gold); }
  /* monitors: a slim strip. Click one to arrange the windows on it; drop an account on it to send that window there */
  .monmap { position: relative; min-height: 40px; margin-bottom: 3px; }
  .monmap .mon { position: absolute; display: flex; align-items: center; gap: 6px; padding: 2px 6px; box-sizing: border-box; overflow: hidden;
         border: 1px solid var(--line); border-radius: 3px; background: linear-gradient(var(--mon-hi), var(--mon-lo)); cursor: pointer; }
  .monmap .mon:hover { border-color: var(--gold); }
  .monmap .mon .n { flex: none; font: bold 15px Georgia, serif; color: var(--gold); white-space: nowrap; }
  .monmap .mon .meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .monmap .mon .res { font-size: 9px; color: var(--dim); }
  .monmap .mon .chips { display: flex; flex-wrap: wrap; gap: 2px; margin: 0; }
  .monmap .mon .chip2 { font-size: 9px; padding: 0 3px; border-radius: 2px; background: var(--source-craft-bg); color: var(--good-soft); white-space: nowrap; }
  .monmap .mon .chip2[draggable="true"] { cursor: grab; }
  .monmap .mon.drop { border-color: var(--gold-hi); box-shadow: inset 0 0 0 1px rgba(240,207,126,.6); background: linear-gradient(var(--mon-drop-hi), var(--mon-drop-lo)); }
  .monmap.dragon .mon { border-style: dashed; }
  /* layout presets: each button draws the monitors as they are placed, split the way it puts the windows */
  .lays { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; margin: 0 0 3px; }
  .lays:empty { display: none; }
  .lays .lbl { font-size: 9px; color: var(--dim); margin-right: 1px; }
  .lays button.b.lay { height: auto; padding: 2px 4px; display: inline-flex; }
  .lays .lmap { position: relative; display: block; }
  .lays .lm { position: absolute; box-sizing: border-box; border: 1px solid var(--line); background: var(--well); }
  .lays .lm b { position: absolute; box-sizing: border-box; background: var(--bevel-ring); box-shadow: inset 0 0 0 1px var(--well); }
  .lays button.b.lay:hover .lm b { background: var(--gold); }
  .lays button.b.lay.on { box-shadow: inset 0 0 0 1px var(--gold); }
  .lays button.b.lay.on .lm b { background: var(--gold-hi); }
  #winMsg { line-height: 13px; }
  /* accounts: one row per client, like the game's party window; actions line up on the right */
  .slots { border: 1px solid #000; box-shadow: inset 0 0 0 1px rgba(106,92,62,.45);
           background: linear-gradient(rgba(40,35,26,.55), rgba(16,14,11,.55)); }
  .slot { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 8px; row-gap: 2px; align-items: center;
          padding: 4px 6px; border-bottom: 1px solid rgba(106,92,62,.25); }
  .slot:last-child { border-bottom: 0; }
  .slot .who { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .slot .who .dot { flex: none; margin: 0 1px 0 0; }
  .slot input.name { flex: 1; min-width: 0; max-width: 170px; height: 18px; padding: 0 3px; font: bold 11px Tahoma, sans-serif;
                     color: var(--text-hi); background: transparent; border: 0; box-shadow: none; }
  .slot input.name:hover { box-shadow: inset 0 0 0 1px var(--line); }
  .slot input.name:focus { background: var(--well); box-shadow: inset 0 0 0 1px var(--focus); }
  .slot .acts { display: flex; align-items: center; justify-content: flex-end; gap: 3px; }
  .slot .acts .pri { min-width: 72px; display: inline-flex; align-items: center; justify-content: center; gap: 4px; }
  .slot .acts .pri svg { width: 12px; height: 12px; }
  .slot .acts [data-a="close"]:hover:not(:disabled) { background: linear-gradient(var(--close-hover-hi), var(--close-hover-lo)); }
  .slot .acts [data-a="remove"] { width: 18px; color: var(--dim); background: none; border-color: transparent; box-shadow: none; }
  .slot .acts [data-a="remove"]:hover { color: var(--bad-hi); background: none; }
  .slot .sub { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 3px 10px; padding-left: 13px; min-height: 13px; }
  .slot .info { flex: 1 1 150px; min-width: 0; font-size: 10px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot.on .info { color: var(--text); }
  .slot.dc { background: rgba(228,90,74,.08); box-shadow: inset 0 0 0 1px rgba(228,90,74,.55); }
  .slot.dc .info { color: var(--bad-hi); font-weight: bold; }
  .slot .bars, .slot .movers { display: flex; align-items: center; gap: 3px; }
  .slot .bars:empty, .slot .movers:empty { display: none; }
  .mbar { position: relative; width: 64px; height: 11px; background: var(--well); border: 1px solid #000; box-shadow: inset 0 0 0 1px var(--line-dim); }
  .mbar i { position: absolute; inset: 1px; transform-origin: left center; }

const LOCALES = { pt: "pt-BR", en: "en-GB", de: "de-DE", es: "es-ES" };
let LANG = "pt";
const t = (key, vars = {}) => (I18N[LANG][key] ?? I18N.pt[key] ?? key).replace(/\{(\w+)\}/g, (_, k) => vars[k] ?? "");

function applyI18n() {
  document.documentElement.lang = LOCALES[LANG];
  const gm = S && S.gm;
  const gmVars = { name: gm ? gm.name : "" };
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n, gmVars));
  $("#gmBadge").title = gm ? t("tipGm", gmVars) : t("aboutGenericName");
  if (!gm) {  // no gm.json: generic "About"
    document.querySelector("#aboutModal .gmname").textContent = t("aboutGenericName");
    document.querySelector('#aboutModal [data-i18n="aboutServer"]').textContent = t("aboutGenericServer");
    document.querySelector('#aboutModal [data-i18n="aboutThanks"]').textContent = t("aboutGenericThanks");
  }
  document.querySelectorAll("[data-i18n-html]").forEach(el => el.innerHTML = t(el.dataset.i18nHtml));
  document.querySelectorAll("[data-i18n-title]").forEach(el => el.title = t(el.dataset.i18nTitle));
  document.querySelectorAll("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  document.querySelectorAll("[data-i18n-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.i18nAria)));
  document.querySelectorAll("[data-lang]").forEach(b => b.classList.toggle("gold", b.dataset.lang === LANG));
  // dynamically built content
  applySlotTexts();
  if ($("#monMap")) $("#monMap").dataset.sig = "";
  if ($("#monLays")) $("#monLays").dataset.sig = "";
  document.querySelectorAll(".vote").forEach(r => {
    const [bv, ba, br] = r.querySelectorAll("button");
    bv.textContent = t("btnVote"); ba.title = t("tipVotedAgo"); br.title = t("tipVoteReset");
  });
  document.querySelectorAll("#links button").forEach(b => b.textContent = t(b.dataset.key));
  ["#bosses", "#timers"].forEach(s => { const el = $(s); if (el) { el.dataset.sig = ""; el.dataset.ids = ""; } });
  renderChatColors();
  enhance();
}

const $ = s => document.querySelector(s);
// write to the page only when the value changed: the loop runs every second and most values stay the same
const setText = (el, v) => { v = String(v); if (el && el.textContent !== v) el.textContent = v; };
const setHTML = (el, v) => { if (el && el.dataset.h !== v) { el.dataset.h = v; el.innerHTML = v; } };
const setClass = (el, v) => { if (el && el.className !== v) el.className = v; };
const setTitle = (el, v) => { if (el && el.title !== v) el.title = v; };
const setDisabled = (el, v) => { v = !!v; if (el && el.disabled !== v) el.disabled = v; };
const isTab = id => $("#p-" + id).classList.contains("sel");

// ---- keyboard and screen readers: rows and icons drawn as divs become buttons you can Tab to
const CLICKABLE = ".tbtn, .gm, .boss .nm, .boss .fav, .recipe, .spi .n, .spgrp, .ev, .sb, .monmap .mon, .chip, .prow, [data-src], .maplegend .lgh";
const EXPANDS = ".boss .nm, .spi .n, .recipe, .spgrp, .ev, .maplegend .lgh";
const SYMBOLIC = /^[\s\p{Extended_Pictographic}\p{S}\p{P}]*$/u;
function syncExpanded(el) {
  const host = el.closest(".boss, .spi, .recipe, .ev");
  const open = el.matches(".spgrp") ? (el.querySelector(".arr") || {}).textContent === "▾"
    : el.matches(".maplegend .lgh") ? el.closest(".maplegend").classList.contains("open")
    : !!host && host.classList.contains("open");
  el.setAttribute("aria-expanded", open ? "true" : "false");
}
function enhance(root = document.body) {
  const all = sel => root.matches && root.matches(sel) ? [root, ...root.querySelectorAll(sel)] : [...root.querySelectorAll(sel)];
  for (const el of all(CLICKABLE)) {
    if (!el.hasAttribute("role")) el.setAttribute("role", "button");
    if (!el.hasAttribute("tabindex")) el.tabIndex = 0;
  }
  all(EXPANDS).forEach(syncExpanded);
  for (const el of all(".boss .fav")) el.setAttribute("aria-pressed", el.classList.contains("on") ? "true" : "false");
  // icon-only controls: the tooltip is also their name
  for (const el of all("button[title], [role=button][title]")) {
    if (el.title && SYMBOLIC.test(el.textContent) && (!el.hasAttribute("aria-label") || el.dataset.ariaAuto)) {
      el.setAttribute("aria-label", el.title); el.dataset.ariaAuto = "1";
    }

document.addEventListener("keydown", e => {

  if (top) {
    if (e.key === "Escape") { e.preventDefault(); top.onCancel(); return; }
    if (e.key === "Tab") {
      const f = [...top.m.querySelectorAll("button, input, select, [tabindex='0']")].filter(x => !x.disabled && x.getClientRects().length);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1], a = document.activeElement;
      if (!top.m.contains(a)) { e.preventDefault(); first.focus(); }
      else if (e.shiftKey && a === first) { e.preventDefault(); last.focus(); }

      return;
    }
  }
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target;
  if (!el || !el.getAttribute || /^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) return;
  const key = focusKey(el);
  const role = el.getAttribute("role");

function buildSlots() {
  const box = $("#slots");
  box.innerHTML = "";
  S.slots.forEach((s, i) => {
    const d = document.createElement("div");
    d.className = "slot";
    d.dataset.slot = i;
    d.innerHTML = `
      <div class="who"><i class="dot"></i><input class="name" maxlength="20" spellcheck="false"></div>
      <div class="acts">
        <button class="b gold pri" data-a="launch">${ICON.play}<span></span></button>
        <button class="b pri" data-a="focus">${ICON.front}<span></span></button>
        <button class="b ico" data-a="login">${ICON.key}</button>
        <button class="b ico" data-a="minimize">${ICON.min}</button>
        <button class="b ico" data-a="close">${ICON.power}</button>
        <button class="b ico" data-a="account">${ICON.user}</button>

      </div>
      <div class="sub"><span class="info"></span><span class="bars"></span><span class="movers"></span></div>`;
    d.ondragstart = e => {
      if (e.target !== d) return;

    d.ondragover = e => { if (dragSlot != null && dragSlot !== i) { e.preventDefault(); d.classList.add("drop"); } };
    d.ondragleave = () => d.classList.remove("drop");
    d.ondrop = async e => {
      e.preventDefault();
      d.classList.remove("drop");
      const from = dragSlot;
      endDrag();
      if (from == null || from === i) return;
      await api.swap_clients(from, i);
      loopNow();
    };
    const inp = d.querySelector("input");
    inp.value = s.name;
    inp.addEventListener("change", async () => { inp.value = await api.rename(i, inp.value); });
    inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur(); });
    d.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
      const a = b.dataset.a;
      if (a === "launch") {
        if (S.running >= S.hwidLimit && !await confirmDlg(t("confirmLimit", { n: S.running, max: S.hwidLimit }), t("btnOpen"))) return;
        api.launch(i);
      } else if (a === "account") {
        accountDlg(i);
      } else if (a === "login") {
        const r = await api.fill_login(i);
        if (r !== "ok") confirmDlg(t("fillFail", { why: t(r) }), "OK", false);
      } else if (a === "close") {
        if (await confirmDlg(t("confirmClose", { name: S.slots[i].name }), t("btnClose"))) api.close(i);
      } else if (a === "remove") {
        if (await confirmDlg(t("confirmRemove", { name: S.slots[i].name }), t("btnDelete"))) { await api.remove_slot(i); loopNow(); }
      } else api[a](i);
    });
    box.appendChild(d);
  });

  let add = $("#addCard");
  if (!add) {
    add = document.createElement("button");
    add.className = "addrow";
    add.id = "addCard";
    add.onclick = async () => { await api.add_slot(); loopNow(); };

// layout presets: the ways to put the open game windows on the monitors (counts[k] = windows on monitor k,
// at most 4 on one so none gets tiny). Even spreads first, then all on one monitor, then the rest.
const LAY_CAP = 4, LAY_MAX = 10;
function layoutCounts(n, m) {
  if (!n || m < 2) return [];
  const out = [];
  const rec = (acc, left) => {
    if (acc.length === m - 1) { if (left <= LAY_CAP) out.push([...acc, left]); return; }
    for (let c = Math.min(LAY_CAP, left); c >= 0; c--) rec([...acc, c], left - c);
  };
  rec([], n);
  if (!out.length) out.push(Array.from({ length: m }, (_, k) => Math.floor(n / m) + (k < n % m ? 1 : 0)));
  const spread = c => Math.max(...c) - Math.min(...c);
  const rank = c => spread(c) <= 1 ? 0 : c.filter(x => x).length === 1 ? 1 : 2;
  return out.map((c, k) => ({ c, k }))
    .sort((a, b) => rank(a.c) - rank(b.c) || spread(a.c) - spread(b.c) || a.k - b.k)
    .slice(0, LAY_MAX).map(x => x.c);
}
// the cells of grid() in the panel: [col, row, cols, rows] of each window on a monitor
function layoutCells(m, count) {
  if (!count) return [];
  let cols = Math.ceil(Math.sqrt(count)), rows = Math.ceil(count / cols);
  if (m.w < m.h && cols > rows) [cols, rows] = [rows, cols];
  return Array.from({ length: count }, (_, k) => [k % cols, Math.floor(k / cols), cols, rows]);
}
function renderLayouts() {
  const box = $("#monLays");
  const mons = S.monitors || [], wins = S.wins || [];
  const names = wins.map(w => w.slot == null ? t("layOther") : (S.slots[w.slot] || {}).name || "");
  const sig = JSON.stringify([mons, wins, names, LANG]);
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  const all = layoutCounts(wins.length, mons.length);
  if (!all.length) { box.innerHTML = ""; return; }
  // the monitors drawn as they are placed, like the map above: 15 px tall, 2 px apart
  const minX = Math.min(...mons.map(m => m.x)), minY = Math.min(...mons.map(m => m.y));
  const maxX = Math.max(...mons.map(m => m.x + m.w)), maxY = Math.max(...mons.map(m => m.y + m.h));
  const k = 15 / Math.min(...mons.map(m => m.h)), gap = 2;
  const order = {};
  mons.map((m, i) => i).sort((a, b) => mons[a].x - mons[b].x).forEach((i, o) => { order[i] = o; });
  const W = Math.round((maxX - minX) * k + gap * (mons.length - 1)), H = Math.round((maxY - minY) * k);
  box.innerHTML = `<span class="lbl">${esc(t("layLbl"))}</span>` + all.map(counts => {
    // windows go in slot order to monitor 1 (the main one), then 2...: the same order as the panel's list
    const plan = counts.flatMap((c, i) => Array(c).fill(i));
    const on = wins.every((w, j) => w.monitor === plan[j]);
    let at = 0;
    const tip = counts.map((c, i) => {
      const who = names.slice(at, at += c);
      return c ? t("layMon", { n: i + 1, names: who.join(" + ") }) : "";
    }).filter(Boolean).join(" · ");
    const draw = mons.map((m, i) =>
      `<i class="lm" style="left:${Math.round((m.x - minX) * k + order[i] * gap)}px;top:${Math.round((m.y - minY) * k)}px;width:${Math.round(m.w * k)}px;height:${Math.round(m.h * k)}px">` +
      layoutCells(m, counts[i]).map(([cx, cy, cols, rows]) =>
        `<b style="left:${cx * 100 / cols}%;top:${cy * 100 / rows}%;width:${100 / cols}%;height:${100 / rows}%"></b>`).join("") +
      `</i>`).join("");
    return `<button class="b lay${on ? " on" : ""}" data-plan="${plan.join(",")}" title="${esc(tip)}" aria-label="${esc(tip)}" aria-pressed="${on}">` +
      `<span class="lmap" style="width:${W}px;height:${H}px">${draw}</span></button>`;
  }).join("");
  box.querySelectorAll("[data-plan]").forEach(b => b.onclick = async () => {
    const ok = await api.arrange(b.dataset.plan.split(",").map(Number));
    $("#winMsg").textContent = ok ? t("winTiled") : t("layChanged");
    loopNow();
  });
}

// drag a client (its card, or its chip on the monitor map) onto a monitor
let dragSlot = null;
function startDrag(e, i) {
  dragSlot = i;

  $("#winMsg").textContent = t("dropHere");

function endDrag() {
  dragSlot = null;
  document.querySelectorAll(".slot.dragging").forEach(x => x.classList.remove("dragging"));
  document.querySelectorAll(".mon.drop, .slot.drop").forEach(x => x.classList.remove("drop"));
  $("#monMap").classList.remove("dragon");
}

// server events: live status from the announcements read in the chat, else the schedule
const evOpen = new Set();
function evStatus(e, now) {
  const live = (S.eventLive || {})[e.key];
  const since = e.last != null ? now - e.last : null;
  const left = e.next != null ? e.next - now : null;
  const clock = ts => new Date(ts * 1000).toLocaleTimeString(LOCALES[LANG], { hour: "2-digit", minute: "2-digit" });
  if (live && now - live.at < 3 * 3600) {
    const ago = now - live.at;
    if (live.state === "cancelled" && ago < 3600) return { txt: t("evCancelled", { at: clock(live.at) }), cls: "bad", rank: 5e8 };
    if (live.state === "ended" && ago < 3600) return { txt: t("evEnded", { t: fmt(ago) }), cls: "", rank: 5e8 };
    if (live.state === "reg" || live.state === "soon") {
      // the schedule is exact; the announcement may have been read late
      const st = left != null && left > 0 && left < 45 * 60 ? e.next : live.start;
      if (st && st > now) return { txt: t(live.state === "reg" ? "evReg" : "evSoon", { t: fmt(st - now) }), cls: "now", rank: -1e8 + (st - now) };
      if (st && now - st < e.dur * 60) return { txt: t("evStarted", { t: fmt(now - st) }), cls: "now", rank: -1e9 };
    }
    if (live.state === "started" && ago < e.dur * 60)
      return { txt: t(e.kind === "restart" ? "evSpawned" : "evStarted", { t: fmt(ago) }), cls: "now", rank: -1e9 };
  }
  if (since != null && since < e.dur * 60) return { txt: t(e.kind === "restart" ? "evSpawned" : "evStarted", { t: fmt(since) }), cls: "now", rank: -1e9 };
  if (left != null && e.reg && left <= e.reg * 60) return { txt: t("evReg", { t: fmt(left) }), cls: "now", rank: -1e8 + left };
  if (e.next != null) {
    const at = new Date(e.next * 1000).toLocaleString(LOCALES[LANG], { weekday: left > 86400 ? "short" : undefined, hour: "2-digit", minute: "2-digit" });
    return { txt: t("evIn", { t: fmt(left), at }), cls: left < 3600 ? "soon" : "", rank: left };
  }
  return { txt: t(e.kind === "chat" ? "evChat" : "evWaitAnn"), cls: "", rank: 1e12 };
}

let evViewedAt = 0;
function renderEvents() {
  const box = $("#events");
  if (!box || !S.events || !isTab("ev")) return;
  if ($("#p-ev").classList.contains("sel") && Date.now() - evViewedAt > 20000) { evViewedAt = Date.now(); api.events_viewed(); }
  const now = Date.now() / 1000;
  const sts = Object.fromEntries(S.events.map(e => [e.key, evStatus(e, now)]));
  const evs = [...S.events].sort((a, b) => sts[a.key].rank - sts[b.key].rank);
  const sig = evs.map(e => e.key).join(",") + LANG;
  if (box.dataset.sig !== sig) {
    box.dataset.sig = sig;
    box.innerHTML = evs.map(e => `<div class="ev" data-ev="${e.key}"><div class="top"><span class="nm"></span><span class="when"></span></div>
      <div class="det"><div class="how"></div><div><b>${esc(t("evRewards"))}:</b> <span class="drops"></span></div></div></div>`).join("");
    S.events.forEach(e => {
      const el = box.querySelector(`[data-ev="${e.key}"]`);
      el.querySelector(".nm").textContent = e.name;
      el.querySelector(".how").textContent = t("ev_" + e.key);
      el.querySelector(".drops").textContent = e.drops;
      el.classList.toggle("open", evOpen.has(e.key));
      el.onclick = () => { evOpen.has(e.key) ? evOpen.delete(e.key) : evOpen.add(e.key); el.classList.toggle("open"); };
    });
  }
  S.events.forEach(e => {

// ================================================= spoil
let SPOIL = null, spMode = "item", spOpen = null;
async function loadSpoil() {

}
const spKindOf = k => k === "material" ? "material" : k === "recipe" ? "recipe" : "other";
// average items per spoil = chance x average amount
const spYield = (chance, lo, hi) => chance / 100 * (lo + hi) / 2;
function spLevelOk(lv) {

}
function spArea(m) { return m.custom ? t("spCustom") : m.floor ? t("dFloor", { zone: m.area, floor: m.floor }) : (m.area || "—"); }
// amount per spoil; a few server lists give the bigger number first ([10.0...9.0])
const spQty = (lo, hi) => lo === hi ? lo : Math.min(lo, hi) + "–" + Math.max(lo, hi);
const spSrvMark = on => on ? `<span class="sv" title="${esc(t("spSrvTip"))}">✓</span>` : "";
const SP_CATS = ["material", "craft", "part", "recipe", "enchant", "gear", "dye", "other"];
const SP_GRADES = ["—", "D", "C", "B", "A", "S", "S80", "S84"];
let spCat = "", spGrade = "", spCollapsed = new Set(["material", "craft", "part", "recipe", "enchant", "gear", "dye", "other",
                                                      "g0", "g1", "g2", "g3", "g4", "g5", "g6", "g7"]);
const spCatOf = it => it.cat || spKindOf(it.kind);
function spGradeBadge(it) {
  if (it.grade == null) return `<span class="gb none"></span>`;

}
function spChips() {

  const total = Object.keys(items).length;

  const sig = LANG + spCat + total;
  if (cs.dataset.sig !== sig) {
    cs.dataset.sig = sig;
    cs.innerHTML = `<button class="b ${spCat ? "" : "on"}" data-spc="">${esc(t("spAll"))}<i>${total}</i></button>` +
      SP_CATS.filter(c => counts[c]).map(c => `<button class="b ${spCat === c ? "on" : ""}" data-spc="${c}">${esc(t("spc_" + c))}<i>${counts[c]}</i></button>`).join("");
    cs.querySelectorAll("[data-spc]").forEach(b => b.onclick = () => { spCat = b.dataset.spc; spGrade = ""; spOpen = null; renderSpoil(); });
  }
  const gs = $("#spGrades");
  const graded = ["recipe", "part", "gear"].includes(spCat);
  const gsig = LANG + spCat + spGrade;
  if (gs.dataset.sig !== gsig) {

      SP_GRADES.map((g, k) => `<button class="b ${spGrade === String(k) ? "on" : ""}" data-spg="${k}">${g === "—" ? esc(t("spNoGrade")) : g}</button>`).join("") : "";
    gs.querySelectorAll("[data-spg]").forEach(b => b.onclick = () => { spGrade = b.dataset.spg; renderSpoil(); });

const spItemOk = iid => {

const spSig = () => [LANG, spMode, $("#spQ").value.trim().toLowerCase(), spCat, spGrade, $("#spSort").value, $("#spGroup").value,
  $("#spMin").value, $("#spMax").value, spOpen, [...spCollapsed].join()].join("|");
// the monsters (in the level range) that give an item, best first
function spItemSources(iid) {

  }

// what the server's own list says about an item: complete, or only the pages seen so far
function spSrvNote(it) {

// what the server's card said about a monster: aggressive or not, HP, defences
function spSrvMob(m) {

    .map(([iid, c, lo, hi, srv]) => `<tr><td>${spGradeBadge(items[iid] || {})}</td><td>${ico(iid)} ${esc((items[iid] || {}).name || iid)}</td>
      <td class="k">${esc(t("spc_" + spCatOf(items[iid] || {})))}</td><td class="r">${fmtChance(c)}</td><td class="sv">${spSrvMark(srv)}</td>

// the server's lists: how much of them was seen, and what changed in them
function spSrvLine() {

// open or close one row where it is: redrawing a list of a thousand rows for one click is slow

async function renderSpoil() {

  const box = $("#spList");
  const sig = spSig();
  if (box.dataset.sig === sig) return;
  box.dataset.sig = sig;
  const mobs = SPOIL.mobs, items = SPOIL.items;
  const itemOk = spItemOk;
  let html = "";
  if (spMode === "item") {
    // items -> which monsters give them (only monsters in the level range)
    const byItem = {};
    for (const [mid, m] of Object.entries(mobs)) {
      if (!spLevelOk(m.level)) continue;
      for (const [iid, c, lo, hi] of m.spoil) (byItem[iid] = byItem[iid] || []).push([mid, c, lo, hi]);
    }
    const rows = Object.entries(byItem).filter(([iid]) => itemOk(iid) && (!q || (items[iid].name || "").toLowerCase().includes(q)))
      .map(([iid, srcs]) => {

        const best = Math.max(...srcs.map(s => spYield(s[1], s[2], s[3])));

      });
    const sorter = { name: (a, b) => a.it.name.localeCompare(b.it.name), best: (a, b) => b.best - a.best || a.it.name.localeCompare(b.it.name),
                     level: (a, b) => a.lo - b.lo || a.it.name.localeCompare(b.it.name),
                     grade: (a, b) => (b.it.grade ?? -1) - (a.it.grade ?? -1) || b.best - a.best || a.it.name.localeCompare(b.it.name) }[sort] || ((a, b) => b.best - a.best);

        <span class="lv2" title="${esc(t("spLvTip"))}">${r.lo === r.hi ? r.lo : r.lo + "–" + r.hi}</span>
        <span class="bc" title="${esc(t("spBestTip"))}">${fmtChance(r.bestChance)}</span>
        <span class="c">${esc(t("spMobs", { n: r.srcs.length }))}</span></div>` + (spOpen === r.iid ? spItemDetail(r.iid) : "");

    const mobGrade = m => Math.max(0, ...m.spoil.filter(([iid]) => itemOk(iid)).map(([iid]) => (items[iid] || {}).grade ?? 0));
    const byLevel = (a, b) => a[1].level - b[1].level || a[1].name.localeCompare(b[1].name);

    setText($("#spInfo"), t("spInfoMobs", { n: list.length }));
    const showT = esc(t("bmShow"));
    html = list.map(([mid, m]) => {

        ${m.spots && m.spots.length ? `<button class="b" data-spmap="${mid}" title="${showT}" aria-label="${showT}">🗺</button>` : ""}</div>` + (spOpen === mid ? spMobDetail(mid) : "");
    }).join("");

// open the side map on a monster's spawn spots (with every monster that gives the item, if one is chosen)

const toMap = (x, y) => [(x - MAPI.x0) / MAPI.sx, (y - MAPI.y0) / MAPI.sy];
function fitMap() {
  // the continent: game x -110k..250k, y -200k..270k
  const v = $("#mapView"), [x1, y1] = toMap(-110000, -200000), [x2, y2] = toMap(250000, 270000);
  const s = Math.min(v.clientWidth / (x2 - x1), v.clientHeight / (y2 - y1));
  mapT = { s, x: (v.clientWidth - (x2 - x1) * s) / 2 - x1 * s, y: (v.clientHeight - (y2 - y1) * s) / 2 - y1 * s };
}
function centerOnBoss(id) {
  const b = (S.bosses || []).find(x => x.id === id);
  if (!b || !MAPI || b.x == null) return;
  const v = $("#mapView");
  if (!mapT) fitMap();
  mapT.s = Math.max(mapT.s, 0.6);
  const [mx, my] = toMap(b.x, b.y);
  mapT.x = v.clientWidth / 2 - mx * mapT.s;
  mapT.y = v.clientHeight / 2 - my * mapT.s;
  layoutMap();
}
function zoomMap(f, cx, cy) {
  const v = $("#mapView");
  if (!mapT) fitMap();
  if (!f) { fitMap(); layoutMap(); return; }
  cx = cx ?? v.clientWidth / 2; cy = cy ?? v.clientHeight / 2;
  const ns = Math.max(0.08, Math.min(3, mapT.s * f)), k = ns / mapT.s;
  mapT.x = cx - (cx - mapT.x) * k; mapT.y = cy - (cy - mapT.y) * k; mapT.s = ns;
  layoutMap();
}
function layoutMap() {
  if (!MAPI || !MAPI.ready || !mapT) return;
  const img = $("#mapImg");
  img.style.transform = `translate(${mapT.x}px,${mapT.y}px) scale(${mapT.s})`;
  const v = $("#mapView");
  v.classList.toggle("zmid", mapT.s >= 0.45);
  v.classList.toggle("znear", mapT.s >= 0.75);
  const P = (x, y) => { const [mx, my] = toMap(x, y); return [mx * mapT.s + mapT.x, my * mapT.s + mapT.y]; };
  $("#mapPins").querySelectorAll("[data-x]").forEach(el => {
    const [px, py] = P(+el.dataset.x, +el.dataset.y);
    el.style.left = px + "px"; el.style.top = py + "px";
    if (el.classList.contains("acct")) {
      el.style.width = 32768 / MAPI.sx * mapT.s + "px"; el.style.height = 32768 / MAPI.sy * mapT.s + "px";
    }
    if (el.classList.contains("town")) el.style.display = mapT.s > 0.18 ? "" : "none";
    let show = true;
    if (el.dataset.zoom) show = mapT.s >= +el.dataset.zoom;
    if (el.dataset.zoommax) show = mapT.s < +el.dataset.zoommax;
    if (el.dataset.layer && mapLayers[el.dataset.layer] === false) show = false;
    el.style.display = show ? "" : "none";
  });
  // the route: dashed jumps for the teleports, a solid line for the run
  let svg = "";
  if (mapRoute && mapRoute.startXY) {
    let [px, py] = P(mapRoute.startXY.x, mapRoute.startXY.y);
    svg += `<circle cx="${px}" cy="${py}" r="5" style="fill:var(--good)" stroke="#000"/>`;
    mapRoute.steps.filter(st => st.x != null).forEach(st => {
      const [nx, ny] = P(st.x, st.y);
      svg += st.kind !== "run"
        ? `<line x1="${px}" y1="${py}" x2="${nx}" y2="${ny}" style="stroke:var(--announce)" stroke-width="2" stroke-dasharray="5 4"/><circle cx="${nx}" cy="${ny}" r="4" style="fill:var(--announce)" stroke="#000"/>`
        : `<line x1="${px}" y1="${py}" x2="${nx}" y2="${ny}" style="stroke:var(--gold-hi)" stroke-width="3"/>`;
      [px, py] = [nx, ny];
    });
  }
  $("#mapSvg").innerHTML = svg;
}

function bossStatus(b) {
  if (b.remaining != null && b.remaining > 0) return { txt: fmt(b.remaining), cls: b.remaining < 3600 ? "soon" : "dead" };
  if (b.remaining != null) return { txt: t("bossSpawned"), cls: "soon", tip: t("bossSpawnedTip") };
  return { txt: b.status === "alive" ? t("bossAlive") : b.status, cls: "alive" };
}

function bossDetail(b) {
  const rows = [];
  const kv = (k, v) => rows.push(`<div class="kv"><span>${esc(k)}</span><b>${v}</b></div>`);
  kv(t("dId"), esc(b.id));
  if (b.level) kv(t("dLevel"), esc(b.level));
  if (b.zone) kv(t("dZone"), esc(b.floor ? t("dFloor", { zone: b.zone, floor: b.floor }) : t("dZoneNear", { zone: b.zone })) + (b.zoneLevel ? ` <span class="small">· ${esc(t("dZoneLv", { lv: b.zoneLevel }))}</span>` : ""));
  if (b.x != null && (b.x || b.y)) {
    kv(t("dCoords"), `<span class="mono">${b.x}, ${b.y}, ${b.z}</span> <button class="b copy" data-copy="${b.x} ${b.y} ${b.z}">${esc(t("btnCopy"))}</button>
      <button class="b copy" data-onmap="${esc(b.id)}">${esc(t("bmShow"))}</button>`);
  }
  const st = bossStatus(b);
  if (b.respawnAt && b.remaining > 0) kv(t("dRespawn"), esc(t("dRespawnAt", { date: fmtDate(b.respawnAt), left: fmt(b.remaining) })));
  else kv(t("dStatus"), `<span class="st ${st.cls}">${esc(st.txt)}</span>`);
  if (b.maxHp) {
    const pct = b.hp != null ? Math.max(0, Math.min(100, b.hp / b.maxHp * 100)) : 0;
    rows.push(`<div class="kv"><span>${esc(t("dHp"))}</span><div class="gauge hpg"><div class="fill hp" style="width:calc(${pct}% - 2px)"></div>
      <div class="val">${fmtNum(b.hp)} / ${fmtNum(b.maxHp)}</div></div></div>
      <div class="small right">${esc(t("dHpAge", { age: fmt(b.hpAge || 0) }))}</div>`);
  } else rows.push(`<div class="small hint">${esc(t("dHpHint"))}</div>`);
  rows.push(`<div class="kv"><span>${esc(t("dDrops"))}</span><b class="small">${esc(t("dDropsHint"))}</b></div>`);
  if (b.desc) rows.push(`<div class="lore"><span>${esc(t("dLore"))}</span>${esc(b.desc)}</div>`);
  if (!b.level && !b.zone) rows.push(`<div class="small hint">${esc(t("dCustom"))}</div>`);
  return rows.join("");
}

function renderBosses() {
  const all = S.bosses || [];
  const q = $("#bSearch").value.trim().toLowerCase();
  // level range: preset ("40-59") or custom (min/max)
  let lo = null, hi = null;
  if (bossView.range === "custom") {
    lo = bossView.min !== "" ? +bossView.min : null;
    hi = bossView.max !== "" ? +bossView.max : null;
  } else if (bossView.range) {
    [lo, hi] = bossView.range.split("-").map(Number);
  }
  const inRange = b => (lo == null && hi == null) ||
    (b.level != null && (lo == null || b.level >= lo) && (hi == null || b.level <= hi));
  const list = all.filter(b =>
    (bossFilter === "all" || (bossFilter === "epic" && b.type === "epic") ||
     (bossFilter === "dead" && b.remaining != null && b.remaining > 0) || (bossFilter === "fav" && b.fav)) &&
    inRange(b) &&
    (!q || b.name.toLowerCase().includes(q) || (b.zone || "").toLowerCase().includes(q)));

  const respawnKey = b => b.remaining != null && b.remaining > 0 ? b.remaining : 1e12 + (b.type === "epic" ? 0 : 1);
  const byName = (a, b) => a.name.localeCompare(b.name);
  const NOLV = 1e6;  // bosses without a level (custom ones) always go last
  const sorters = {
    respawn: (a, b) => respawnKey(a) - respawnKey(b) || byName(a, b),
    lvlAsc: (a, b) => (a.level ?? NOLV) - (b.level ?? NOLV) || respawnKey(a) - respawnKey(b) || byName(a, b),
    lvlDesc: (a, b) => (b.level ?? -NOLV) - (a.level ?? -NOLV) || respawnKey(a) - respawnKey(b) || byName(a, b),
    name: byName,
  };
  list.sort(sorters[bossView.sort] || sorters.respawn);

  const newest = all.length ? Math.min(...all.map(b => b.age)) : null;
  setHTML($("#bInfo"), all.length
    ? t("bossInfo", { shown: t("bossShown", { shown: list.length, n: all.length }), age: fmt(newest) })
    : t("bossEmpty"));

  const box = $("#bosses");
  if (isTab("boss")) {
  const sig = LANG + "|" + openBoss + "|" + bossView.sort + "|" + list.map(b => b.id + (b.fav ? "*" : "")).join(",");
  if (box.dataset.sig !== sig) {
    box.dataset.sig = sig;
    box.innerHTML = list.length ? "" : `<div class="small" style="padding:6px">${esc(t("bossNone"))}</div>`;
    list.forEach(b => {
      const r = document.createElement("div");
      r.className = "boss" + (b.type === "epic" ? " epic" : "") + (openBoss === b.id ? " open" : "");
      r.dataset.id = b.id;
      r.innerHTML = `<span class="fav${b.fav ? " on" : ""}" title="${esc(t("tipFav"))}">★</span>
        <span class="tag">${b.type === "epic" ? "E" : ""}</span><span class="lv">${b.level || ""}</span>
        <span class="nm"></span><span class="st"></span>`;
      r.querySelector(".nm").textContent = b.name;
      r.querySelector(".fav").onclick = e => { e.stopPropagation(); api.boss_fav(b.id, !b.fav); };
      r.onclick = () => { openBoss = openBoss === b.id ? null : b.id; renderBosses(); };
      box.appendChild(r);
      if (openBoss === b.id) {
        const d = document.createElement("div");
        d.className = "bdetail"; d.dataset.detail = b.id;
        box.appendChild(d);
      }
    });
  }
  list.forEach(b => {
    const st = box.querySelector(`.boss[data-id="${b.id}"] .st`);
    if (!st) return;
    const s = bossStatus(b);
    setText(st, s.txt); setClass(st, "st " + s.cls); setTitle(st, s.tip || "");
  });
  const det = box.querySelector(".bdetail");
  if (det) {
    const b = list.find(x => x.id === det.dataset.detail);
    const h = b ? bossDetail(b) : "";
    if (b && det.dataset.h !== h) {
      det.dataset.h = h;
      det.innerHTML = h;
      det.querySelectorAll("[data-onmap]").forEach(btn => btn.onclick = e => {
        e.stopPropagation();
        mapSel = btn.dataset.onmap;
        setBossMode("map", true);
      });
      det.querySelectorAll("[data-copy]").forEach(btn => btn.onclick = async e => {
        e.stopPropagation();
        try { await navigator.clipboard.writeText(btn.dataset.copy); } catch (_) {}
        btn.textContent = t("copied");
      });
    }
  }
  }
  if (bossMode === "map") renderBossMap(list);
  const next = all.filter(b => b.fav && b.remaining > 0).sort((a, b) => a.remaining - b.remaining)[0];
  setHTML($("#sBoss"), next ? `👑 ${esc(next.name)} <b>${fmt(next.remaining)}</b>` : "");
}

// ================================================= craft
const fmtInt = n => Math.round(n).toLocaleString(LOCALES[LANG]);

function renderCraftList() {
  const box = $("#recipes");
  if (!RECIPES) return;
  if (!RECIPES.length) { box.innerHTML = `<div class="small" style="padding:6px">${esc(t("cUnavailable"))}</div>`; return; }
  const kind = $("#cKind").value, rate = $("#cRate").value, q = $("#cSearch").value.trim().toLowerCase();
  const list = RECIPES.filter(r => r.id === openRecipe || (!craftFamily || r.family === craftFamily) && (!kind || r.kind === kind) &&
    (!rate || String(r.rate) === rate) && (!q || r.product.toLowerCase().includes(q)) && classFits(r) &&
    (!$("#cSrc").value || ($("#cSrc").value === "obtain") === !!r.obtain) &&
    (!$("#cAccSlot").value || (r.kind === "accessory" && r.cat === $("#cAccSlot").value)) &&
    // accessories only when asked for (Accessories button, type or slot): they would flood the list
    (r.kind !== "accessory" || craftFamily === "Acc" || kind === "accessory" || !!$("#cAccSlot").value));
  $("#cInfo").textContent = t("cInfo", { n: list.length });
  // ordering: strongest first (by group: weapon type, then each armor slot) when a class is picked
  const sortMode = $("#cSort").value || "power";
  const GROUPS = ["weapon", "magic", "offhand", "helmet", "chest", "fullbody", "legs", "gloves", "boots", "necklace", "earring", "ring"];
  const best = {};
  list.forEach(r => { if (r.power) best[r.pgroup] = Math.max(best[r.pgroup] || 0, r.power); });
  if (sortMode === "power") {
    const gi = r => r.pgroup ? GROUPS.indexOf(r.pgroup) : 99;
    list.sort((a, b) => gi(a) - gi(b) || (b.power || 0) - (a.power || 0) || a.product.localeCompare(b.product));
  } else if (sortMode === "name") {
    list.sort((a, b) => a.product.localeCompare(b.product));
  }
  let lastGroup = null;
  box.innerHTML = list.length ? "" : `<div class="small" style="padding:6px">${esc(t("cNone"))}</div>`;
  list.forEach(r => {
    if (sortMode === "power" && (r.pgroup || "other") !== lastGroup) {
      lastGroup = r.pgroup || "other";
      const h = document.createElement("div");
      h.className = "rgroup";
      h.textContent = r.pgroup ? t("slot_" + r.pgroup) : t("cAcc");
      box.appendChild(h);
    }
    const row = document.createElement("div");
    row.className = "recipe" + (openRecipe === r.id ? " open" : "") + (r.mw ? " mwrow" : "") +
      (r.kind === "accessory" ? " accrow" : r.obtain ? " droprow" : "");
    row.innerHTML = `<span class="g ${r.grade === "S84" ? "s84" : ["S", "A", "B", "C", "D", "—"].includes(r.grade) ? "sx" : ""}">${r.grade}</span>${ico(r.productId)}<span class="nm"></span>
      ${r.power ? `<span class="pw ${r.power / best[r.pgroup] < .9 ? "lo" : ""}" title="${esc(t("pwTip"))}">${Math.round(r.power / best[r.pgroup] * 100)}%</span>` : ""}
      <span class="small">${r.npc || r.obtain ? "" : "Lv " + r.level}</span>${r.kind === "accessory" ? `<span class="rt acc">${esc(t("acc_" + r.cat))}</span>` : r.obtain ? `<span class="rt drop">DROP</span>` : r.mw ? `<span class="rt mw" title="${esc(t("cMwOnly"))}">MW ${r.mw.rate.toLocaleString(LOCALES[LANG])}%</span>` : r.npc ? `<span class="rt npc">NPC</span>` : `<span class="rt ${r.rate === 100 ? "r100" : "r60"}">${r.rate}%</span>`}`;
    row.querySelector(".nm").textContent = r.product;
    row.dataset.rid = r.id;
    row.onclick = () => {
      openRecipe = openRecipe === r.id ? null : r.id; craftData = null; craftCmp = null; srcItem = null;
      if (craftView === "cmp") craftView = "plan";
      renderCraftList(); if (openRecipe) loadCraft();
    };
    box.appendChild(row);
    if (openRecipe === r.id) {
      const det = document.createElement("div");
      det.className = "cdetail"; det.id = "craftDetail";
      box.appendChild(det);
      renderCraftDetail(r);
    }
  });
}

async function loadCraft() {
  const r = RECIPES.find(x => x.id === openRecipe);
  craftData = await api.recipe_tree(openRecipe, craftQty, craftFull);
  if (r && openRecipe === r.id) renderCraftDetail(r);
}

function shoppingText(r) {
  const list = craftData.avgShopping || craftData.shopping;
  return [t("cShopTitle", { qty: craftQty, name: r.product })]
    .concat(list.map(s => `${fmtInt(s.qty)} x ${s.name}`)).join("\n");
}

function ico(id) {
  return id ? `<img class="ico" src="/icon/${id}.png" loading="lazy" alt="" onerror="this.onerror=null;this.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7'">` : "";
}

function fmtChance(c) {
  return c.toLocaleString(LOCALES[LANG], { maximumFractionDigits: c < 0.1 ? 4 : c < 10 ? 2 : 1 }) + "%";
}

// the items worth looking up for this recipe: the recipe, the product and every base material
function srcItems(r) {
  const d = craftData, seen = new Set(), out = [];
  const add = (id, name, tag) => { if (id && !seen.has(id)) { seen.add(id); out.push({ id, name, tag }); } };
  if (d.obtain) {
    add(r.productId, r.product);
    if (d.sealed) add(d.sealed, d.sealedName, "S");
    return out;
  }
  add(d.recipeItemId, d.recipeItem, t("srcRecipe"));
  add(r.productId, r.product);
  (d.avgShopping || d.shopping).forEach(s => add(s.id, s.name));
  d.plan.forEach(s => add(s.id, s.name));
  return out;
}

async function loadSources(id) {
  if (!id) return;
  if (srcData[id] === undefined) {
    srcData[id] = null;
    srcData[id] = await api.item_sources(id) || false;
    const r = RECIPES.find(x => x.id === openRecipe);
    if (r && craftView === "src") renderCraftDetail(r);
  }
}

function sourcesHtml(r) {
  const items = srcItems(r);
  if (!srcItem) srcItem = items[0].id;
  const chips = items.map(x => `<span class="chip ${x.id === srcItem ? "on" : ""}" data-pick="${x.id}" title="${esc(x.name)}">${ico(x.id)}${x.tag ? `<b>${x.tag === "S" ? "S" : "R"}</b>` : ""}</span>`).join("");
  const s = srcData[srcItem], cur = items.find(x => x.id === srcItem);
  let html = `<div class="small">${esc(t("srcPick"))}</div><div class="chips">${chips}</div>` +
    `<div class="srcname">${ico(srcItem)}${esc(cur ? cur.name : (srcData[srcItem] && srcData[srcItem].name) || "")}</div>`;
  return html + sourcesBody(s, srcItem);
}

function sourcesBody(s, current) {
  if (s === undefined || s === null) return `<div class="small">…</div>`;
  if (s === false) return `<div class="small">${esc(t("cUnavailable"))}</div>`;
  const mobs = (title, list) => list.length ? `<div class="srch">${esc(title)}</div>` + list.map(m => `<div class="srow">
      <span class="who ${m.boss ? "boss" : ""}">${m.boss ? "♛ " : ""}${esc(m.npc)} <span class="small">Lv ${m.level}</span></span>
      <span class="pc">${fmtChance(m.chance)}</span>
      <span class="where">${esc(m.custom ? t("spCustom") : m.area || t("srcNoArea"))}${Math.max(m.min, m.max) > 1 ? ` · ${spQty(m.min, m.max)}` : ""}${m.aggro != null ? " · " + esc(t(m.aggro ? "srvAggro" : "srvPassive")) : ""}</span></div>`).join("") : "";
  const deals = (title, list, into) => list.length ? `<div class="srch">${esc(title)}</div>` + list.map(d => `<div class="deal">
      <span class="who">${esc(d.npc.join(", "))}</span>${into ? ` → ${ico(d.productId)}<span data-src="${d.productId}">${esc(d.product)}</span>` : ""}
      <div class="cost">${d.cost.filter(c => !into || c.id !== current).map(c => `${fmtInt(c.count)} × <span data-src="${c.id}">${esc(c.name)}</span>`).join(" + ")}</div></div>`).join("") : "";
  const v = s.server;
  const official = title => v ? `${title} · ${t("srvH5")}` : title;
  const srv = v ? `<div class="srvhead">${spSrvMark(true)} ${esc(t(v.complete ? "srvFull" : "srvPart", { d: v.seen ? fmtDate(v.seen) : "—" }))}</div>` +
    mobs(t("srvDrop"), v.drop) + mobs(t("srvSpoil"), v.spoil) : "";
  const body = srv + mobs(official(t("srcDrop")), v && v.completeDrop ? [] : s.drop) +
    mobs(official(t("srcSpoil")), v && v.completeSpoil ? [] : s.spoil) + deals(t("srcBuy"), s.buy, false) + deals(t("srcInto"), s.into, true);
  return (body || `<div class="small">${esc(t("srcNone"))}</div>`) +
    `<div class="small" style="margin-top:5px;line-height:13px">${esc(t("srcNote"))}</div>`;
}

// one passive bonus as text: "+5% Atk. Spd", "+205 HP"
function bonusText(op, stat, val) {
  const key = "st_" + stat, name = I18N[LANG][key] ? t(key) : stat;
  if (op === "mul") {
    const pct = Math.round((val - 1) * 1000) / 10;
    return `${pct > 0 ? "+" : ""}${pct.toLocaleString(LOCALES[LANG])}% ${name}`;
  }
  const v = op === "sub" ? -val : val;
  return `${v > 0 ? "+" : ""}${(Math.round(v * 10) / 10).toLocaleString(LOCALES[LANG])} ${name}`;
}

function classFits(r) {
  const c = CLASSES.find(x => x.name === charProfile.cls);
  if (!c || !charProfile.only) return true;
  if (r.kind === "jewelry" || r.cat === "jewelry" || r.kind === "accessory") return true;
  if (r.kind === "weapon") return c.weapons.includes(r.cat) || r.cat === c.offhand;
  return c.armor.includes(r.cat) || r.cat === c.offhand;
}

function fillCharSelects() {
  const races = [...new Set(CLASSES.map(c => c.race))];
  $("#cRace").innerHTML = `<option value="">${esc(t("raceAll"))}</option>` +
    races.map(r => `<option value="${r}">${esc(t("race_" + r))}</option>`).join("");
  $("#cRace").value = charProfile.race || "";
  const list = CLASSES.filter(c => !charProfile.race || c.race === charProfile.race);
  $("#cClass").innerHTML = `<option value="">${esc(t("classAll"))}</option>` +
    list.map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join("");
  $("#cClass").value = list.some(c => c.name === charProfile.cls) ? charProfile.cls : "";
  $("#cOnly").checked = charProfile.only !== false;
  $("#cPlanBtn").disabled = !charProfile.cls;
}

function saveChar() {
  api.set_option("char", charProfile);
  planData = null; planOpen = null;
  fillCharSelects();
  if (!charProfile.cls && craftMode === "plan") setCraftMode("list");
  renderCraftList();
  if (craftMode === "plan") loadPlan();
}

function setCraftMode(mode) {
  craftMode = mode;
  document.querySelectorAll("[data-cview]").forEach(b => b.classList.toggle("on", b.dataset.cview === mode));
  $("#cPlan").style.display = mode === "plan" ? "" : "none";
  $("#cListWrap").style.display = mode === "plan" ? "none" : "";
  if (mode === "plan") loadPlan();
}

async function loadPlan() {
  if (!charProfile.cls) { $("#cPlan").innerHTML = `<div class="plannote">${esc(t("cPlanPick"))}</div>`; return; }
  if (!planData || planData.cls !== charProfile.cls) {
    $("#cPlan").innerHTML = `<div class="small">…</div>`;
    planData = await api.char_plan(charProfile.cls);
  }
  renderPlan();
}

function renderPlan() {
  const box = $("#cPlan");
  if (!planData) { box.innerHTML = `<div class="small">${esc(t("cUnavailable"))}</div>`; return; }
  const weaponCols = planData.mage ? "M.Atk" : t("cmpDmg");
  let html = `<div class="plannote">${esc(t("cPlanIntro", { cls: planData.cls }))}</div>`;
  planData.slots.forEach(sl => {
    html += `<div class="pslot"><h4><span>${esc(t("slot_" + sl.slot))}</span><span>${sl.slot === "weapon" ? esc(weaponCols) : ""}</span></h4>`;
    sl.rows.forEach(r => {
      const badge = r.how === "mw" ? "mw" : r.how === "drop" ? "drop" : r.how === "unseal" ? "unseal" : "craft";
      const tip = r.mw ? t("cmpMwTip", { rarity: r.mw.rarity, foundation: "Foundation", varnish: "Varnish" }) : "";
      html += `<div class="prow ${r.id === sl.bestCraft ? "best" : ""}" data-plan="${r.id}" data-recipe="${r.recipe || ""}">
        <span class="src ${badge}" title="${esc(tip)}">${esc(t("how_" + r.how))}</span>
        <span class="lb" title="${esc(r.name)}">${ico(r.id)}${esc(r.name)}</span><span class="v">${r.rel}%</span>
        ${r.bonus && r.bonus.length ? `<span></span><span class="bon">${esc(r.bonus.filter(([, s]) => !s.startsWith("pvp")).slice(0, 4).map(([op, s, v]) => bonusText(op, s, v)).join(" · "))}</span>` : ""}
        ${planOpen === r.id ? `<div class="inl">${sourcesBody(srcData[r.id], r.id)}</div>` : ""}</div>`;
    });
    if (!sl.bestCraft) html += `<div class="small" style="padding:2px 0">${esc(t("cPlanNoCraft"))}</div>`;
    html += `</div>`;
  });
  box.innerHTML = html + `<div class="small" style="line-height:13px">${esc(t("srcNote"))}</div>`;
  box.querySelectorAll("[data-plan]").forEach(row => row.onclick = async e => {
    if (e.target.closest(".inl")) return;
    const id = +row.dataset.plan, recipe = +row.dataset.recipe;
    if (recipe) {  // open the recipe in the list
      setCraftMode("list");
      craftFamily = ""; document.querySelectorAll("[data-cf]").forEach(x => x.classList.toggle("on", x.dataset.cf === ""));
      $("#cKind").value = ""; $("#cRate").value = ""; $("#cSearch").value = "";
      openRecipe = recipe; craftData = null; craftCmp = null; srcItem = null; craftView = "plan";
      renderCraftList(); loadCraft();
      $("#craftDetail")?.previousElementSibling?.scrollIntoView({ block: "start" });
      return;
    }
    planOpen = planOpen === id ? null : id;
    renderPlan();
    if (planOpen && srcData[id] === undefined) { srcData[id] = null; srcData[id] = await api.item_sources(id) || false; renderPlan(); }
  });
}

function compareHtml() {
  if (!craftCmp || !craftCmp.data) return `<div class="small">…</div>`;
  if (craftCmp.data.kind === "weapon") return compareWeaponsHtml();
  const c = craftCmp.data, weapon = c.kind === "weapon";
  const jewel = !weapon && c.rows.every(x => !x.pdef);
  const main = x => weapon ? x.patk : (jewel ? x.mdef : x.pdef);
  const max = Math.max(...c.rows.map(main), 1);
  const cols = weapon ? ["P.Atk", "M.Atk"] : (jewel ? ["M.Def", "MP"] : ["P.Def", "M.Def"]);
  const vals = x => weapon ? [x.patk, x.matk] : (jewel ? [x.mdef, x.mp] : [x.pdef, x.mdef]);
  let html = `<div class="cmp chead"><span></span><span>${esc(t("cmpItem"))}</span><span class="v">${cols[0]}</span><span class="v">${cols[1]}</span></div>`;
  c.rows.forEach(x => {
    const [a, b] = vals(x);
    html += `<div class="cmp ${x.me || x.mine ? "me" : ""}">${srcBadge(x)}
      <span class="lb" title="${esc(x.label)}" data-src="${x.id}">${ico(x.id)}${esc(x.label)}</span><span class="v">${a}</span><span class="v">${b || "—"}</span>
      ${bonusLine(x.bonus)}<span></span><span class="bar"><i style="width:${Math.round(main(x) / max * 100)}%"></i></span></div>`;
  });
  return html + `<div class="small" style="margin-top:5px;line-height:13px">${esc(t("cmpNote"))}</div>`;
}

function srcBadge(x) {
  if (x.mw) {
    const tip = t("cmpMwTip", { rarity: x.mw.rarity, foundation: x.mw.foundation, varnish: x.mw.varnish });
    return `<span class="src mw" title="${esc(tip)}">${esc(t("cmpMw"))}</span>`;
  }
  const src = x.unsealed ? ["unseal", t("cmpUnsealed")] : x.craft ? ["craft", t("cmpCraft")]
    : x.unsealCraft ? ["unseal", t("how_unseal")] : ["drop", t("cmpDrop")];
  return `<span class="src ${src[0]}">${esc(src[1])}</span>`;
}

function bonusLine(list, extra = []) {
  const parts = extra.concat((list || []).filter(([, s]) => !["pAtkSpd", "critRate", "critDmgAdd", "pAtk"].includes(s) || !extra.length)
    .map(([op, s, v]) => bonusText(op, s, v)));
  return parts.length ? `<span></span><span class="bon">${esc(parts.join(" · "))}</span>` : "";
}

// weapons: final P.Atk and speed with the passive bonus, critical and the estimated damage index
function compareWeaponsHtml() {
  const rows = craftCmp.data.rows, max = Math.max(...rows.map(x => x.final.index), 1);
  let html = `<div class="cmp w chead"><span></span><span>${esc(t("cmpItem"))}</span><span class="v">P.Atk</span>
    <span class="v">${esc(t("cmpSpd"))}</span><span class="v">${esc(t("cmpDmg"))}</span></div>`;
  rows.forEach(x => {
    const f = x.final, extra = [];
    if ((x.bonus || []).some(([, s]) => s === "critRate")) extra.push(t("cmpCrit", { v: f.critStatus }));
    if (f.critAdd) extra.push(t("cmpCritAdd", { v: f.critAdd }));
    (x.bonus || []).forEach(([op, s, v]) => { if (s === "pAtkSpd" || s === "pAtk") extra.push(bonusText(op, s, v)); });
    html += `<div class="cmp w ${x.me || x.mine ? "me" : ""}">${srcBadge(x)}
      <span class="lb" title="${esc(x.label)}" data-src="${x.id}">${ico(x.id)}${esc(x.label)}</span>
      <span class="v">${f.patk}</span><span class="v">${f.speed}</span><span class="idx">${f.index}</span>
      ${bonusLine(x.bonus, extra)}<span></span><span class="bar"><i style="width:${Math.round(f.index / max * 100)}%"></i></span></div>`;
  });
  return html + `<div class="small" style="margin-top:5px;line-height:13px">${esc(t("cmpNoteW"))}</div>`;
}

function treeHtml(node, depth = 0) {
  const pad = "&nbsp;".repeat(depth * 3);
  const craft = node.crafts != null;
  const meta = !craft ? "" : node.npc && node.npc.length ? ` <span class="m">⚒ NPC</span>` : ` <span class="m">⚒ ${node.rate}% · Lv ${node.level}</span>`;
  let html = `<div class="tnode">${pad}<span class="q">${fmtInt(node.qty)}×</span> ${ico(node.id)}<span class="${craft ? "craftable" : ""}" data-src="${node.id}">${esc(node.name)}</span>${meta}</div>`;
  (node.children || []).forEach(c => { html += treeHtml(c, depth + 1); });
  return html;
}

function renderCraftDetail(r) {
  const det = $("#craftDetail");
  if (!det) return;
  const head = `
    <div class="head"><span class="small">${esc(t("cQty"))}</span><input class="e" id="cQty" value="${craftQty}" maxlength="3">
      <span class="grow"></span><span class="small">${r.grade} · ${esc(r.family)}</span></div>
    <div class="cmode"><button class="b ${craftFull ? "on" : ""}" data-cm="1">${esc(t("cFull"))}</button>
      <button class="b ${craftFull ? "" : "on"}" data-cm="0">${esc(t("cBuy"))}</button></div>`;
  if (r.obtain) return renderObtainDetail(det, r);
  if (!craftData) { det.innerHTML = head + `<div class="small">…</div>`; bindCraftHead(det, r); return; }
  const d = craftData;
  const rare = d.plan.find(s => s.rare);
  let body = d.mw
    ? `<div class="csum">${t("cMwSummary", { base: esc(d.mw.base), rarity: d.mw.rarity, rate: (d.mw.baseRate * d.mw.rarity / 100).toLocaleString(LOCALES[LANG]), attempts: fmtInt(rare ? rare.makes : 0) })}` +
      ` · ${fmtInt(d.crafts)} crafts · ${fmtInt(d.mp)} MP</div>`
    : d.npc && d.npc.length
    ? `<div class="csum">${t("cNpcSummary", { npc: esc(d.npc.map(n => n.npc).join(" / ")), cost: esc(d.npc.map(n => `${fmtInt(n.count)} ${n.cost}`).join(" / ")) })}` +
      (d.crafts ? ` · ${t("cSummary", { recipe: "", level: d.maxLevel, crafts: fmtInt(d.crafts), mp: fmtInt(d.mp) }).replace(/^[^·]*·\s*/, "")}` : "") + `</div>`
    : `<div class="csum">${t("cSummary", { recipe: esc(d.recipeItem), level: d.maxLevel, crafts: fmtInt(d.crafts), mp: fmtInt(d.mp) })}</div>`;
  if (d.avgAttempts) body += `<div class="cnote">${esc(t("cAvgNote", { rate: d.rate, per: (100 / d.rate).toLocaleString(LOCALES[LANG], { maximumFractionDigits: 2 }), qty: d.quantity, attempts: d.avgAttempts, mp: fmtInt(d.avgMp) }))}</div>`;
  body += `<div class="ctabs">${["plan", "tree", "shop", "cmp", "src"].map(v => `<button class="b ${craftView === v ? "on" : ""}" data-cv="${v}">${esc(t({ plan: "cTabPlan", tree: "cTabTree", shop: "cTabShop", cmp: "cTabCompare", src: "cTabSrc" }[v]))}</button>`).join("")}</div>`;
  let content = "";
  if (craftView === "plan") {
    content = d.plan.map((s, i) => `<div class="step"><span class="n">${i + 1}.</span><span class="what" data-src="${s.id}">${ico(s.id)}${esc(s.rare ? t("cStepRare", { qty: fmtInt(s.makes), of: s.rare.of, name: s.name }) : t("cStep", { qty: fmtInt(s.makes), name: s.name }))}</span>
      <span class="meta">${esc(s.rare ? t("cStepRareMeta", { rarity: s.rare.rarity }) + " · " + t("cStepMeta", { level: s.level, rate: Math.round(s.rate / s.rare.rarity * 100), mp: fmtInt(s.mp) }) : s.npc && s.npc.length ? t("cNpcStep", { npc: s.npc.join(" / ") }) : t("cStepMeta", { level: s.level, rate: s.rate, mp: fmtInt(s.mp) }))}</span></div>`).join("");
  } else if (craftView === "tree") {
    content = treeHtml(d.root);
  } else if (craftView === "cmp") {
    content = compareHtml();
  } else if (craftView === "src") {
    content = sourcesHtml(r);
  } else {
    const list = d.avgShopping || d.shopping;
    content = list.map(s => `<div class="shop"><span data-src="${s.id}">${ico(s.id)}${esc(s.name)}</span><span class="q">${fmtInt(s.qty)}</span></div>`).join("") +
      `<button class="b wide" id="cCopy" style="margin-top:5px">${esc(t("cCopy"))}</button>`;
  }
  det.innerHTML = head + body + `<div class="cbody">${content}</div><div class="small" style="margin-top:4px">${esc(t("cRecipeNote"))}</div>`;
  bindCraftHead(det, r);
  det.querySelectorAll("[data-cv]").forEach(b => b.onclick = async e => {
    e.stopPropagation(); craftView = b.dataset.cv; renderCraftDetail(r);
    if (craftView === "cmp" && (!craftCmp || craftCmp.id !== r.id)) {
      craftCmp = { id: r.id, data: await api.recipe_compare(r.id) };
      if (openRecipe === r.id) renderCraftDetail(r);
    }
    if (craftView === "src") loadSources(srcItem);
  });
  // any item name (tree, plan, shopping list, exchanges) opens its sources
  det.querySelectorAll("[data-src], [data-pick]").forEach(el => el.onclick = e => {
    e.stopPropagation();
    srcItem = +(el.dataset.src || el.dataset.pick); craftView = "src";
    renderCraftDetail(r); loadSources(srcItem);
    if (el.dataset.src) det.scrollIntoView({ block: "nearest" });
  });
  const copy = det.querySelector("#cCopy");
  if (copy) copy.onclick = async e => {
    e.stopPropagation();
    try { await navigator.clipboard.writeText(shoppingText(r)); } catch (_) {}
    copy.textContent = t("cCopied");
  };
}

function renderObtainDetail(det, r) {
  if (!craftData) { det.innerHTML = `<div class="small">…</div>`; det.onclick = e => e.stopPropagation(); return; }
  if (craftView !== "src" && craftView !== "cmp") craftView = "src";
  const d = craftData;
  if (d.acc) return renderAccessoryDetail(det, r, d);
  let body = `<div class="obtain">${t("cObtainSummary")}` +
    (d.hero ? `<br>${t("cObtainHero")}` : "") +
    (d.sealed ? `<br>${t("cObtainSealed", { sealed: esc(d.sealedName) })}` : "") + `</div>`;
  body += `<div class="ctabs">${["src", "cmp"].map(v => `<button class="b ${craftView === v ? "on" : ""}" data-cv="${v}">${esc(t(v === "src" ? "cTabSrc" : "cTabCompare"))}</button>`).join("")}</div>`;
  const content = craftView === "cmp" ? compareHtml() : sourcesHtml(r);
  det.innerHTML = body + `<div class="cbody">${content}</div>`;
  det.onclick = e => e.stopPropagation();
  det.querySelectorAll("[data-cv]").forEach(b => b.onclick = async e => {
    e.stopPropagation(); craftView = b.dataset.cv; renderCraftDetail(r);
    if (craftView === "cmp" && (!craftCmp || craftCmp.id !== r.id)) {
      craftCmp = { id: r.id, data: await api.recipe_compare(r.id) };
      if (openRecipe === r.id) renderCraftDetail(r);
    }
  });
  det.querySelectorAll("[data-src], [data-pick]").forEach(el => el.onclick = e => {
    e.stopPropagation();
    srcItem = +(el.dataset.src || el.dataset.pick); craftView = "src";
    renderCraftDetail(r); loadSources(srcItem);
  });
  if (craftView === "src" && srcItem && srcData[srcItem] === undefined) loadSources(srcItem);
}

function renderAccessoryDetail(det, r, d) {
  craftView = "src";
  const bonus = (d.bonus || []).map(([op, s, v]) => bonusText(op, s, v));
  const acts = (d.actives || []).filter(a => a.effects.length || a.reuse).map(a =>
    `<span class="act">${esc(t("accActive"))}: ${esc(a.effects.map(([op, s, v]) => bonusText(op, s, v)).join(" · ") || a.name)}` +
    `${a.time ? " · " + esc(t("accTime", { t: a.time })) : ""}${a.reuse ? " · " + esc(t("accReuse", { r: a.reuse })) : ""}</span>`);
  let body = `<div class="obtain">${t("accSummary", { slot: esc(t("acc_" + d.acc)) })}` +
    (d.acc === "bracelet" ? `<br>${t("accBracelet")}` : d.acc === "talisman" ? `<br>${t("accTalisman")}` : "") +
    `<div class="accbon">${bonus.length ? `<b>${esc(t("accBonus"))}:</b> ${esc(bonus.join(" · "))}` : acts.length ? "" : esc(t("accNoBonus"))}` +
    `${acts.length ? (bonus.length ? "<br>" : "") + acts.join("<br>") : ""}</div></div>`;
  det.innerHTML = body + `<div class="cbody">${sourcesHtml(r)}</div>`;
  det.onclick = e => e.stopPropagation();
  det.querySelectorAll("[data-src], [data-pick]").forEach(el => el.onclick = e => {
    e.stopPropagation();
    srcItem = +(el.dataset.src || el.dataset.pick);
    renderCraftDetail(r); loadSources(srcItem);
  });
  if (srcItem && srcData[srcItem] === undefined) loadSources(srcItem);
}

function bindCraftHead(det, r) {
  det.onclick = e => e.stopPropagation();
  const qty = det.querySelector("#cQty");
  qty.onchange = () => {
    const v = Math.max(1, Math.min(999, parseInt(qty.value, 10) || 1));
    qty.value = craftQty = v; craftData = null; renderCraftDetail(r); loadCraft();
  };
  qty.onkeydown = e => { if (e.key === "Enter") qty.blur(); };
  det.querySelectorAll("[data-cm]").forEach(b => b.onclick = e => {
    e.stopPropagation(); craftFull = b.dataset.cm === "1"; craftData = null; renderCraftDetail(r); loadCraft();
  });
}

function drawGraph(samples) {
  const c = $("#graph"), g = c.getContext("2d");
  const W = c.width, H = c.height, N = S.pingHistory;
  g.clearRect(0, 0, W, H);
  const ok = samples.filter(x => x != null);
  const top = Math.max(300, ...ok) * 1.1;
  g.font = "16px Tahoma";
  [100, 200, 300].forEach(ref => {
    if (ref >= top) return;
    const y = H - ref / top * H;
    g.strokeStyle = "rgba(106,92,62,.35)"; g.setLineDash([4, 6]); g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
    g.setLineDash([]); g.fillStyle = cssVar("--ink-off"); g.fillText(ref, 4, y - 4);
  });
  const step = W / (N - 1), x0 = (N - samples.length) * step;
  g.beginPath();
  let started = false;
  samples.forEach((s, k) => {
    const x = x0 + k * step;
    if (s == null) { g.fillStyle = "rgba(228,90,74,.55)"; g.fillRect(x - 2, 0, 4, H); return; }
    const y = H - s / top * H;
    started ? g.lineTo(x, y) : (g.moveTo(x, y), started = true);
  });
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, cssVar("--gold-hi")); grad.addColorStop(1, cssVar("--bronze-deep"));
  g.strokeStyle = grad; g.lineWidth = 3; g.stroke();
}

let loopTimer = null;
async function loopNow() {
  try { S = await api.get_state(); render(); } catch (_) {}
}

let loopFails = 0, lastRenderErr = "";
const withTimeout = (pr, ms) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]);
async function loop() {
  let ok = false;
  try {
    S = await withTimeout(api.get_state(), 8000);
    ok = true;
  } catch (e) {
    console.error(e);
    // say it once per outage, and show it after a few seconds (a single slow answer is not an outage)
    if (++loopFails === 1) { try { api.log_js("loop: " + (e && (e.stack || e.message) || e)); } catch (_) {} }
    if (loopFails >= 3) $("#conn").classList.add("show");
  }
  if (ok) {
    loopFails = 0;
    $("#conn").classList.remove("show");
    try {
      if (!built) build();
      render();
    } catch (e) {
      const msg = "render: " + (e && (e.stack || e.message) || e);
      console.error(e);
      if (msg !== lastRenderErr) { lastRenderErr = msg; try { api.log_js(msg); } catch (_) {} }
    }
  }
  setTimeout(loop, 1000);
}

// the interface talks to Python over local HTTP (works with or without administrator rights)
const TOKEN = new URLSearchParams(location.search).get("t");
api = new Proxy({}, {
  get: (_, name) => (...args) => fetch("/api/" + name, {
    method: "POST", headers: { "X-Token": TOKEN, "Content-Type": "application/json" }, body: JSON.stringify(args),
  }).then(r => { if (!r.ok) throw new Error(`${name}: HTTP ${r.status}`); return r.json(); }),
});
window.onerror = (m, src, l, c, e) => { try { api.log_js(`${m} @${l}:${c} ${e && e.stack || ""}`); } catch (_) {} };
document.querySelectorAll(".drag").forEach(el => el.addEventListener("mousedown", e => {
  if (e.button === 0 && !e.target.closest(".tbtn, button, input")) { e.preventDefault(); api.drag_start(); }
}));
loop();
</script>
